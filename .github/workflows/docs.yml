name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "inc/**"
      - "README.md"
      - "Doxyfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Fetch doxygen-awesome-css theme
        run: git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git

      - name: Build docs
        run: doxygen Doxyfile

      - uses: actions/upload-pages-artifact@v3
        with:
          path: doxygen-build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
